name: arm64-atomic-probe

# Throwaway: does a 16-byte __sync CAS need libatomic on MSYS2 CLANGARM64? Delete once the
# windows-arm64 build is settled.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe 16-byte atomics
    runs-on: windows-11-arm
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: true
          pacboy: >-
            clang:p lld:p

      - name: Compile and link
        shell: msys2 {0}
        run: |
          set -euo pipefail
          clang --version
          cat > /tmp/atomics128.cpp <<'EOF'
          using u128 = unsigned __int128;
          struct S { u128 v; };
          extern "C" int main() {
              S s{};
              volatile u128* p = &s.v;
              return __sync_val_compare_and_swap(p, 0, 1) == 0 ? 0 : 1;
          }
          EOF
          echo "--- baseline armv8-a (what the build uses) ---"
          if clang++ --target=aarch64-w64-windows-gnu -fuse-ld=lld /tmp/atomics128.cpp -o /tmp/a1.exe; then
            echo "BASELINE_LINK_OK"
          else
            echo "BASELINE_LINK_FAILED"
          fi
          echo "--- with -march=armv8.2-a+lse+rcpc ---"
          if clang++ --target=aarch64-w64-windows-gnu -march=armv8.2-a+lse+rcpc -fuse-ld=lld /tmp/atomics128.cpp -o /tmp/b1.exe; then
            echo "LSE_LINK_OK"
          else
            echo "LSE_LINK_FAILED"
          fi
          echo "--- baseline plus -latomic ---"
          if clang++ --target=aarch64-w64-windows-gnu -fuse-ld=lld /tmp/atomics128.cpp -latomic -o /tmp/c1.exe; then
            echo "ATOMIC_LINK_OK"
          else
            echo "ATOMIC_LINK_FAILED"
          fi
          command -v aarch64-w64-windows-gnu-nm >/dev/null && aarch64-w64-windows-gnu-nm -u /tmp/a1.exe 2>/dev/null | grep atomic || true
