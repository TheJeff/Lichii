name: arm64-probe

# Throwaway: checks which runner images can host the Windows ARM64 build. Delete with the
# arm64 workflow once the real build is settled.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label to probe
        default: windows-11-arm
        type: choice
        options:
          - windows-11-arm
          - windows-2022

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Report
        shell: bash
        run: |
          uname -a
          echo "PROCESSOR_ARCHITECTURE=$PROCESSOR_ARCHITECTURE"
          command -v clang || echo "no clang on PATH"
          command -v cmake || echo "no cmake on PATH"
